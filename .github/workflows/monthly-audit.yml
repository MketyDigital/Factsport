name: Monthly Champion Audit

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: 

jobs:
  run-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Audit API
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          [ -n "$CRON_KEY" ] || { echo "::error::CRON_KEY is missing"; exit 1; }
          curl --silent --show-error --fail-with-body -X POST \
            -H "Authorization: Bearer $CRON_KEY" \
            "https://factsport.com/api/admin/run-audit"