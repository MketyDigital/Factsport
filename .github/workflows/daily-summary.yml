name: Daily Matchday Round-Up

on:
  schedule:
    # Runs at 22:55 UTC (Approx 11:55 AM Nigeria Time)
    - cron: '55 22 * * *'
  workflow_dispatch: # Allows manual button click

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: npm install @supabase/supabase-js @google/generative-ai

      - name: Run Summary Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }} # 👈 Grabs the new Account B key
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node scripts/daily-summary.js