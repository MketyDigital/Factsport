name: Matchmaker (ESPN ID Sync)

on:
  schedule:
    - cron: '0 6 * * *'  
    - cron: '0 12 * * *' 
  workflow_dispatch:

jobs:
  map-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Matchmaker API on Production
        run: |
          curl -L -f -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" "https://factsport.com/api/matchmaker?key=${{ secrets.CRON_KEY }}&t=$(date +%s)"