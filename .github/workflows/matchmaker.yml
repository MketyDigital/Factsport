name: Matchmaker (ESPN ID Sync)

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  map-matches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate cron credential
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          [ -n "$CRON_KEY" ] && [ "${#CRON_KEY}" -ge 32 ] || {
            echo "::error::CRON_KEY is missing or too short"
            exit 1
          }
      - name: Hit the Matchmaker API on Production
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_KEY" \
            -H "User-Agent: Factsport-Matchmaker/2.0" \
            "https://factsport.com/api/matchmaker"
