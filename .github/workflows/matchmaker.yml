name: Matchmaker (ESPN ID Sync)

on:
  schedule:
    - cron: '0 6 * * *'  # Runs at 6:00 AM UTC
    - cron: '0 12 * * *' # Runs at 12:00 PM UTC
  workflow_dispatch:

jobs:
  map-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Matchmaker API
        run: |
          curl -X GET "https://factsport.vercel.app/api/matchmaker?key=${{ secrets.CRON_KEY }}"