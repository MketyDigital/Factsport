name: Factsport v2 database preflight (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-db-preflight.yml'

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database client dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only Azure PostgreSQL inventory
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          [ -n "$DATABASE_URL" ] || {
            echo "::error::Repository secret DATABASE_URL is unavailable."
            exit 1
          }
          node --input-type=module <<'NODE'
          import postgres from 'postgres';

          const sql = postgres(process.env.DATABASE_URL, {
            max: 1,
            ssl: 'require',
            connect_timeout: 15,
            idle_timeout: 2,
            prepare: false,
          });

          try {
            const [server] = await sql`
              SELECT current_database() AS database_name,
                     current_user AS connected_role,
                     inet_server_addr()::text AS server_address,
                     (SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()) AS tls_enabled
            `;
            const relations = await sql`
              SELECT
                to_regclass('public.external_identities') IS NOT NULL AS external_identities,
                to_regclass('public.media_editorial_memberships') IS NOT NULL AS media_editorial_memberships
            `;
            const roleNames = [
              'factsport_v2_public_reader',
              'factsport_v2_editorial_writer',
              'factsport_v2_prediction_api',
              'factsport_v2_social_dispatcher',
              'factsport_v2_broadcast_admin',
              'factsport_v2_broadcast_token_issuer',
            ];
            const roles = await sql`
              SELECT rolname, rolsuper, rolcreaterole, rolcreatedb
              FROM pg_roles
              WHERE rolname = ANY(${roleNames})
              ORDER BY rolname
            `;
            const migrationTables = await sql`
              SELECT table_schema, table_name
              FROM information_schema.tables
              WHERE table_type = 'BASE TABLE'
                AND table_name ~* '(migration|schema_version)'
              ORDER BY table_schema, table_name
            `;
            console.log(JSON.stringify({
              database: server.database_name,
              connectedRole: server.connected_role,
              tlsEnabled: server.tls_enabled === true,
              targetDatabaseMatches: server.database_name === 'factsport_v2',
              discoveredMigrationTrackingTables: migrationTables,
              requiredMediaTables: relations[0],
              roleInventory: roleNames.map(name => {
                const role = roles.find(item => item.rolname === name);
                return role ? {
                  name,
                  exists: true,
                  superuser: role.rolsuper,
                  canCreateRoles: role.rolcreaterole,
                  canCreateDatabases: role.rolcreatedb,
                } : { name, exists: false };
              }),
            }, null, 2));
            if (server.database_name !== 'factsport_v2' || server.tls_enabled !== true) {
              throw new Error('Connected database or TLS state does not match the expected target.');
            }
          } catch (error) {
            const code = error && typeof error === 'object' && 'code' in error
              ? String(error.code) : null;
            console.error(JSON.stringify({ error: 'database_preflight_failed', code }));
            process.exitCode = 1;
          } finally {
            await sql.end({ timeout: 2 });
          }
          NODE
