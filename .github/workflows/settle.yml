name: Match Settlement Automator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  settle-bets:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Settlement API on Production
        run: |
          curl -L -f -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" "https://factsport.com/api/settle?key=${{ secrets.CRON_KEY }}&t=$(date +%s)"