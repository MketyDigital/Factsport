name: FactSport Automated Matrix Engines

on:
  schedule:
    # 🧠 Pro AI Analysis: Runs every single hour from 2:00 AM to 12:00 PM UTC
    - cron: '0 2-12 * * *'
    
    # ☀️ Daily Morning Preview: Runs exactly at 08:00 UTC every day
    - cron: '0 8 * * *'
    
    # 🌙 Daily Matchday Round-Up: Runs exactly at 22:40 UTC every day
    - cron: '40 22 * * *'

  workflow_dispatch: # 🟢 Keeps manual run buttons unlocked for all tasks

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install only required dependencies once for speed optimization
      - name: Install System Dependencies
        run: npm install @supabase/supabase-js @google/generative-ai

      # 🟢 TASK 1: Pro AI Analysis Engine (Runs on the 2 AM - 12 PM hourly cron cycles)
      # Handled by your optimized script with local cache + micro-batching shields
      - name: Run AI Pro Slip Engine
        if: |
          github.event.schedule == '0 2-12 * * *' || 
          github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/generate-pro-slips.js

      # ☀️ TASK 2: Daily Morning Preview (Runs on the 8 AM UTC cron cycle)
      - name: Run Daily Morning Preview
        if: |
          github.event.schedule == '0 8 * * *' || 
          github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: node scripts/daily-preview.js

      # 🌙 TASK 3: Daily Matchday Round-Up (Runs on the 10:40 PM UTC cron cycle)
      - name: Run Daily Matchday Round-Up
        if: |
          github.event.schedule == '40 22 * * *' || 
          github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_NEWS_KEY: ${{ secrets.GEMINI_NEWS_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: node scripts/daily-summary.js