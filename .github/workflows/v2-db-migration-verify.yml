name: Factsport v2 disposable PostgreSQL migration verification

# Applies the complete reviewed chain only to an ephemeral CI database.
# This workflow never connects to the Azure staging or production database.
on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - 'db/migrations/**'
      - '.github/workflows/v2-db-migration-verify.yml'

permissions:
  contents: read

concurrency:
  group: factsport-v2-disposable-postgres
  cancel-in-progress: true

jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: factsport_v2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: factsport-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factsport_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: factsport-ci-only-password
      DATABASE_URL: postgresql://postgres:factsport-ci-only-password@127.0.0.1:5432/factsport_v2
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Seed isolated runtime roles
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'factsport_v2_reader',
              'factsport_v2_schedule_writer',
              'factsport_v2_espn_writer',
              'factsport_v2_editorial_writer',
              'factsport_v2_media_automation_writer',
              'factsport_v2_social_dispatcher',
              'factsport_v2_media_broadcast_admin',
              'factsport_v2_broadcast_token_issuer',
              'factsport_v2_media_access_admin',
              'factsport_v2_prediction_api'
            ] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = role_name) THEN
                EXECUTE format('CREATE ROLE %I NOLOGIN', role_name);
              END IF;
            END LOOP;
          END
          $$;
          SQL
      - name: Apply every migration in sequence to disposable PostgreSQL
        run: |
          set -euo pipefail
          count=0
          for migration in db/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "::group::Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            echo "::endgroup::"
            count=$((count + 1))
          done
          [ "$count" -eq 43 ] || {
            echo "::error::Expected 43 ordered migrations; applied $count."
            exit 1
          }
          echo "Applied $count migrations to the disposable CI database."

      - name: Verify Prediction submission function and least-privilege boundary
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            function_oid regprocedure;
          BEGIN
            function_oid := to_regprocedure(
              'public.submit_public_prediction(text,text,text,uuid,text,text,text,boolean,text,text,integer,integer)'
            );
            IF function_oid IS NULL THEN
              RAISE EXCEPTION 'Prediction submission function is missing';
            END IF;
            IF to_regprocedure('public.get_public_prediction_visitor_state(text)') IS NULL
              OR NOT has_function_privilege(
                'factsport_v2_prediction_api',
                'public.get_public_prediction_visitor_state(text)',
                'EXECUTE'
              ) THEN
              RAISE EXCEPTION 'Prediction visitor-state function/EXECUTE grant is missing';
            END IF;
            IF to_regclass('public.prediction_submission_rate_limits') IS NULL
              OR to_regprocedure('public.consume_public_prediction_rate_limit(text,text,integer,integer)') IS NULL
              OR NOT has_function_privilege(
                'factsport_v2_prediction_api',
                'public.consume_public_prediction_rate_limit(text,text,integer,integer)',
                'EXECUTE'
              ) THEN
              RAISE EXCEPTION 'Prediction rate-limit table/function/EXECUTE grant is missing';
            END IF;
            IF NOT has_function_privilege(
              'factsport_v2_prediction_api', function_oid, 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'Prediction API role cannot execute the submission function';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_proc AS proc,
                   LATERAL aclexplode(COALESCE(
                     proc.proacl,
                     pg_catalog.acldefault('f', proc.proowner)
                   )) AS privilege
              WHERE proc.oid = function_oid
                AND privilege.grantee = 0
                AND privilege.privilege_type = 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'PUBLIC must not execute the Prediction submission function';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc
              WHERE oid = function_oid AND prosecdef = true
                AND proconfig @> ARRAY['search_path=pg_catalog, public']
            ) OR EXISTS (
              SELECT 1
              FROM pg_proc AS proc,
                   LATERAL aclexplode(COALESCE(
                     proc.proacl,
                     pg_catalog.acldefault('f', proc.proowner)
                   )) AS privilege
              WHERE proc.oid IN (
                'public.get_public_prediction_visitor_state(text)'::regprocedure,
                'public.consume_public_prediction_rate_limit(text,text,integer,integer)'::regprocedure
              )
                AND (
                  NOT proc.prosecdef
                  OR NOT (proc.proconfig @> ARRAY['search_path=pg_catalog, public'])
                  OR (privilege.grantee = 0 AND privilege.privilege_type = 'EXECUTE')
                )
            ) THEN
              RAISE EXCEPTION 'Prediction functions must be SECURITY DEFINER, search_path-pinned and closed to PUBLIC';
            END IF;
            IF has_table_privilege('factsport_v2_prediction_api', 'public.matches', 'SELECT')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_contacts', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_participants', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.predictions', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.marketing_subscriptions', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.marketing_consent_events', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_participant_claims', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_claim_conflicts', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_rule_acceptances', 'SELECT,INSERT,UPDATE,DELETE')
              OR has_table_privilege('factsport_v2_prediction_api', 'public.prediction_submission_rate_limits', 'SELECT,INSERT,UPDATE,DELETE') THEN
              RAISE EXCEPTION 'Prediction API role has direct table access; only function execution is allowed';
            END IF;
          END
          $verify$;

          INSERT INTO public.matches (
            id, league, home_team, away_team, match_date, status
          ) VALUES
            ('00000000-0000-4000-8000-000000000043',
             'CI', 'Home', 'Away', '2099-01-01T12:00:00Z', 'SCHEDULED'),
            ('00000000-0000-4000-8000-000000000044',
             'CI', 'Home 2', 'Away 2', '2099-01-02T12:00:00Z', 'SCHEDULED'),
            ('00000000-0000-4000-8000-000000000045',
             'CI', 'Home 3', 'Away 3', '2099-01-03T12:00:00Z', 'LIVE'),
            ('00000000-0000-4000-8000-000000000046',
             'CI', 'Home 4', 'Away 4', '2099-01-04T12:00:00Z', 'UNRECOGNIZED'),
            ('00000000-0000-4000-8000-000000000047',
             'CI', 'Home 5', 'Away 5', transaction_timestamp(), 'SCHEDULED'),
            ('00000000-0000-4000-8000-000000000048',
             'CI', 'Race Home', 'Race Away', '2099-01-08T12:00:00Z', 'SCHEDULED');

          BEGIN;
          UPDATE public.matches
             SET match_date=transaction_timestamp()
           WHERE id='00000000-0000-4000-8000-000000000047';
          SET ROLE factsport_v2_prediction_api;
          DO $verify$
          DECLARE
            first_result record;
            retry_result record;
            consent_result record;
            second_browser_result record;
            rate_first boolean;
            rate_second boolean;
            visitor_known boolean;
          BEGIN
            visitor_known := public.get_public_prediction_visitor_state(
              'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            );
            IF visitor_known IS NOT FALSE THEN
              RAISE EXCEPTION 'New visitor unexpectedly exists before first submission';
            END IF;
            SELECT * INTO first_result FROM public.submit_public_prediction(
              'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
              'ci-prediction@example.test',
              'CI Visitor',
              '00000000-0000-4000-8000-000000000043',
              'home', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.', false, NULL, NULL, 2, 1
            );
            SELECT * INTO retry_result FROM public.submit_public_prediction(
              'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
              NULL, NULL,
              '00000000-0000-4000-8000-000000000043',
              'away', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.', false, NULL, NULL, 0, 1
            );
            IF first_result.prediction_id IS NULL OR first_result.duplicate IS NOT FALSE THEN
              RAISE EXCEPTION 'First Prediction submission did not create one prediction';
            END IF;
            IF retry_result.prediction_id IS DISTINCT FROM first_result.prediction_id
              OR retry_result.duplicate IS NOT TRUE THEN
              RAISE EXCEPTION 'Prediction retry was not idempotently recognized';
            END IF;
            SELECT * INTO consent_result FROM public.submit_public_prediction(
              'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
              NULL, NULL,
              '00000000-0000-4000-8000-000000000043',
              'draw', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.',
              true, 'factsport-email-marketing-v1',
              'Yes, email me Factsport product updates and offers. I understand I can unsubscribe at any time.',
              1, 1
            );
            IF consent_result.prediction_id IS DISTINCT FROM first_result.prediction_id
              OR consent_result.duplicate IS NOT TRUE THEN
              RAISE EXCEPTION 'Marketing consent retry must not create a second prediction';
            END IF;
            visitor_known := public.get_public_prediction_visitor_state(
              'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            );
            IF visitor_known IS NOT TRUE THEN
              RAISE EXCEPTION 'Visitor state lookup did not recognize the submitted participant';
            END IF;
            rate_first := public.consume_public_prediction_rate_limit(
              'visitor',
              'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
              60, 1
            );
            rate_second := public.consume_public_prediction_rate_limit(
              'visitor',
              'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
              60, 1
            );
            IF rate_first IS NOT TRUE OR rate_second IS NOT FALSE THEN
              RAISE EXCEPTION 'Prediction rate-limit counter did not enforce the configured threshold';
            END IF;
            SELECT * INTO second_browser_result FROM public.submit_public_prediction(
              'cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc',
              'ci-prediction@example.test',
              'Other Browser',
              '00000000-0000-4000-8000-000000000044',
              'draw', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.',
              false, NULL, NULL, 1, 1
            );
            IF second_browser_result.prediction_id IS NULL
              OR second_browser_result.duplicate IS NOT FALSE THEN
              RAISE EXCEPTION 'A second browser sharing the email did not get an independent participant/prediction';
            END IF;

            BEGIN
              PERFORM * FROM public.submit_public_prediction(
                'dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd',
                'live@example.test', 'Live Check',
                '00000000-0000-4000-8000-000000000045',
                'home', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.',
                false, NULL, NULL, 1, 0
              );
              RAISE EXCEPTION 'Live match was incorrectly accepted';
            EXCEPTION WHEN SQLSTATE '55000' THEN NULL;
            END;

            BEGIN
              PERFORM * FROM public.submit_public_prediction(
                'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee',
                'unknown@example.test', 'Unknown Check',
                '00000000-0000-4000-8000-000000000046',
                'home', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.',
                false, NULL, NULL, 1, 0
              );
              RAISE EXCEPTION 'Unknown match status was incorrectly accepted';
            EXCEPTION WHEN SQLSTATE '55000' THEN NULL;
            END;

            BEGIN
              PERFORM * FROM public.submit_public_prediction(
                'ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff',
                'past@example.test', 'Kickoff Check',
                '00000000-0000-4000-8000-000000000047',
                'home', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.',
                false, NULL, NULL, 1, 0
              );
              RAISE EXCEPTION 'Kickoff equality was incorrectly accepted';
            EXCEPTION WHEN SQLSTATE '55000' THEN NULL;
            END;
          END
          $verify$;
          RESET ROLE;
          COMMIT;

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE factsport_v2_prediction_api; SELECT * FROM public.submit_public_prediction('gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg', 'race@example.test', 'Race Visitor', '00000000-0000-4000-8000-000000000048', 'home', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.', false, NULL, NULL, 1, 0);" > /tmp/prediction-race-1.log &
          race_pid_1=$!
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE factsport_v2_prediction_api; SELECT * FROM public.submit_public_prediction('gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg', 'race@example.test', 'Race Visitor', '00000000-0000-4000-8000-000000000048', 'away', 'free-prediction-v1', 'I have read and accept the Factsport free prediction rules and privacy notice.', false, NULL, NULL, 0, 1);" > /tmp/prediction-race-2.log &
          race_pid_2=$!
          wait "$race_pid_1"
          wait "$race_pid_2"

          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM public.predictions) <> 3
              OR (SELECT count(*) FROM public.prediction_participants) <> 3
              OR (SELECT count(*) FROM public.prediction_contacts) <> 2
              OR (SELECT count(*) FROM public.prediction_rule_acceptances) <> 3
              OR (SELECT count(*) FROM public.predictions
                  WHERE match_id='00000000-0000-4000-8000-000000000048') <> 1
              OR (SELECT count(*) FROM public.prediction_participants
                  WHERE visitor_token_hash='gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg') <> 1 THEN
              RAISE EXCEPTION 'Prediction and versioned rules acceptance were not persisted atomically';
            END IF;
            IF (SELECT count(*) FROM public.marketing_subscriptions
                WHERE status='pending_confirmation') <> 1
              OR (SELECT count(*) FROM public.marketing_consent_events
                  WHERE event_type='opt_in') <> 1 THEN
              RAISE EXCEPTION 'Explicit marketing opt-in was not stored as pending confirmation with evidence';
            END IF;
          END
          $verify$;
          SQL
          echo "Prediction API role is EXECUTE-only; submission, rules acceptance, optional pending marketing consent and rate limits verified."

      - name: Verify Media, VOD and least-privilege database contracts
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.media_assets') IS NULL
              OR to_regclass('public.media_asset_derivatives') IS NULL
              OR to_regclass('public.media_video_assets') IS NULL
              OR to_regclass('public.editorial_article_revision_videos') IS NULL
              OR to_regclass('public.public_editorial_article_videos') IS NULL
              OR to_regclass('public.public_editorial_article_video_tokens') IS NULL
              OR to_regclass('public.media_social_delivery_attempts') IS NULL
              OR to_regclass('public.media_social_outbox') IS NULL
              OR to_regclass('public.media_social_operator_reconciliation') IS NULL THEN
              RAISE EXCEPTION 'Required Media/VOD/social objects are missing after migration apply';
            END IF;

            IF NOT has_column_privilege(
              'factsport_v2_editorial_writer',
              'public.media_video_assets',
              'rights_status',
              'UPDATE'
            ) THEN
              RAISE EXCEPTION 'Editorial writer cannot perform the approved video rights workflow';
            END IF;

            IF has_column_privilege(
              'factsport_v2_editorial_writer',
              'public.media_video_assets',
              'provider_video_id',
              'UPDATE'
            ) THEN
              RAISE EXCEPTION 'Editorial writer must not rewrite the provider video identity';
            END IF;

            IF NOT has_column_privilege(
              'factsport_v2_social_dispatcher',
              'public.media_social_delivery_attempts',
              'provider_started_at',
              'UPDATE'
            ) THEN
              RAISE EXCEPTION 'Dispatcher lacks the single-provider-call lock permission';
            END IF;

            IF has_column_privilege(
              'factsport_v2_social_dispatcher',
              'public.media_social_delivery_attempts',
              'started_at',
              'UPDATE'
            ) THEN
              RAISE EXCEPTION 'Dispatcher must not rewrite immutable attempt start time';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name='media_video_assets'
                AND column_name='signed_playback_required'
                AND column_default LIKE '%true%'
            ) THEN
              RAISE EXCEPTION 'VOD signed-playback default is missing';
            END IF;

 
            IF NOT has_table_privilege(
              'factsport_v2_editorial_writer',
              'public.media_social_operator_reconciliation',
              'SELECT'
            ) THEN
              RAISE EXCEPTION 'Editorial writer cannot inspect the private reconciliation queue';
            END IF;

            IF has_table_privilege(
              'factsport_v2_reader',
              'public.media_social_operator_reconciliation',
              'SELECT'
            ) OR has_table_privilege(
              'factsport_v2_social_dispatcher',
              'public.media_social_operator_reconciliation',
              'SELECT'
            ) THEN
              RAISE EXCEPTION 'Reconciliation queue must remain private to the editorial operator';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.media_editorial_audit_events'::regclass
                AND conname='media_editorial_audit_events_action_check'
                AND pg_get_constraintdef(oid) LIKE '%social_delivery_reconciled_published%'
            ) THEN
              RAISE EXCEPTION 'Social reconciliation audit actions are not registered';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.media_video_assets'::regclass
                AND conname='media_video_public_requires_ready_rights'
            ) THEN
              RAISE EXCEPTION 'VOD public-read rights constraint is missing';
            END IF;
          END
          $$;
          SQL
          echo "Disposable PostgreSQL migrations 0001–0043 and Media/VOD/social privilege assertions passed."
