name: Factsport v2 ESPN reconciliation preview (read-only)

on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-espn-reconciliation-preview.yml'

permissions:
  contents: read

concurrency:
  group: factsport-v2-espn-reconciliation-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KEY }}
      FACTSPORT_ESPN_HD_ID: c5166b8496624a80a0a77c750585c271
    steps:
      - name: Verify exact ESPN writer Hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] || exit 1
          STATUS="$(curl -sS -o /tmp/factsport-espn-hd.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$FACTSPORT_ESPN_HD_ID")"
          [ "$STATUS" = 200 ] &&
            jq -e '.success == true and .result.name == "factsport-v2-espn-postgres" and
              .result.origin.database == "factsport_v2" and
              .result.origin.user == "factsport_v2_espn_writer"' /tmp/factsport-espn-hd.json >/dev/null ||
            { echo "::error::Refusing unexpected ESPN Hyperdrive"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy temporary protected reconciliation preview
        id: deploy
        run: npx --yes wrangler@4 deploy --config wrangler.factsport-espn-reconciliation-preview.jsonc
      - name: Install ephemeral preview token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put FACTSPORT_PREVIEW_TOKEN \
            --config wrangler.factsport-espn-reconciliation-preview.jsonc
          echo "FACTSPORT_PREVIEW_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run read-only ESPN reconciliation preview
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN_HTTP="$(curl -sS -o /tmp/factsport-domain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          [ "$DOMAIN_HTTP" = 200 ] || exit 1
          DOMAIN="$(jq -r '.result.subdomain // empty' /tmp/factsport-domain.json)"
          [ -n "$DOMAIN" ] || exit 1
          BASE="https://factsport-v2-espn-reconciliation-preview.$DOMAIN.workers.dev/__internal/reconciliation-preview"
          ready=false
          for attempt in 1 2 3 4 5 6 7 8; do
            HTTP="$(curl -sS --max-time 90 -o /tmp/factsport-espn-preview.json -w '%{http_code}' \
              -H "Authorization: Bearer $FACTSPORT_PREVIEW_TOKEN" "$BASE")"
            if [ "$HTTP" = 200 ] && jq -e '.ok == true and .dryRun == true and .writesPerformed == 0' \
              /tmp/factsport-espn-preview.json >/dev/null 2>&1; then ready=true; break; fi
            echo "Read-only ESPN preview attempt $attempt: HTTP $HTTP"
            if [ -s /tmp/factsport-espn-preview.json ]; then
              jq '{ok, error, providerErrors, fixtureRowsScanned, scoreboardGroupsChecked}' /tmp/factsport-espn-preview.json 2>/dev/null || true
            fi
            sleep 4
          done
          [ "$ready" = true ] || { echo "::error::ESPN preview did not complete successfully"; exit 1; }
          UNAUTH="$(curl -sS -o /tmp/factsport-espn-preview-unauth -w '%{http_code}' "$BASE")"
          [ "$UNAUTH" = 404 ] || { echo "::error::Preview must reject unauthenticated requests"; exit 1; }
          jq -r '"Fixtures scanned: (.fixtureRowsScanned); ESPN events: (.normalizedEspnEvents); unique candidates: (.uniqueCandidateCount); ambiguous: (.ambiguousCount); no match: (.noMatchCount)"' \
            /tmp/factsport-espn-preview.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Dry-run only: no match rows or score fields were changed." >> "$GITHUB_STEP_SUMMARY"
          jq -r '.candidates[] | "- (.league): (.home_team) vs (.away_team), ESPN ID (.espn_id), kickoff delta (.kickoff_delta_minutes) min"' \
            /tmp/factsport-espn-preview.json >> "$GITHUB_STEP_SUMMARY"
      - name: Delete temporary reconciliation preview Worker
        if: always() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/factsport-espn-preview-delete.json -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/factsport-v2-espn-reconciliation-preview")"
          [ "$STATUS" = 200 ] && jq -e '.success == true' /tmp/factsport-espn-preview-delete.json >/dev/null ||
            { echo "::error::Delete only temporary Factsport ESPN reconciliation preview Worker"; exit 1; }
          echo "Temporary ESPN reconciliation preview Worker removed."
