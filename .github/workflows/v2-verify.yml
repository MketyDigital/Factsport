name: Factsport v2 isolated verification

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - 'app/api/matches/**'
      - 'app/api/match/**'
      - 'app/api/media/**'
      - 'app/api/settings/**'
      - 'app/api/standings/**'
      - 'app/api/competitions/**'
      - 'app/api/cache/**'
      - 'app/api/auth/**'
      - 'app/media-login/**'
      - 'app/lib/admin/**'
      - 'app/lib/**'
      - 'app/auth/**'
      - 'app/login/**'
      - 'app/register/**'
      - 'app/lib/supabase/**'
      - 'lib/auth/**'
      - 'lib/security/**'
      - 'middleware.ts'
      - 'types/**'
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'app/api/internal/**'
      - 'infra/azure/**'
      - 'docs/audit/**'
      - 'docs/implementation/**'
      - 'app/standings/**'
      - 'app/tournaments/**'
      - 'app/highlights/**'
      - 'app/components/**'
      - 'app/news/**'
      - 'app/page.tsx'
      - 'lib/**'
      - 'lib/adapters/postgres-editorial.ts'
      - 'lib/adapters/postgres-homepage.ts'
      - 'lib/adapters/postgres-client.ts'
      - 'lib/seo/**'
      - 'lib/adapters/postgres-matches.ts'
      - 'app/lib/matchService.ts'
      - 'lib/adapters/factsport-cloudflare-bindings.ts'
      - 'types/factsport-cloudflare-workers.d.ts'
      - 'workers/factsport-schema-bootstrap.ts'
      - 'workers/generated-factsport-migration.ts'
      - 'scripts/generate-factsport-bootstrap.cjs'
      - 'db/migrations/**'
      - 'scripts/check-postgres.cjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/v2-verify.yml'

permissions:
  contents: read

jobs:
  verification:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run existing engine regression suite
        run: npm run test:engine
      - name: TypeScript static check
        run: npm run typecheck
      - name: Anonymous prediction and consent schema contract tests
        run: node --test tests/prediction-schema.test.cjs
      - name: PostgreSQL migration inventory and critical Media contract checks
        run: |
          test -s db/migrations/0001_factsport_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.matches" db/migrations/0001_factsport_core.sql
          test -s db/migrations/0003_factsport_public_predictions.sql
          test -s db/migrations/0004_factsport_editorial_media.sql
          test -s db/migrations/0005_factsport_editorial_provenance_review.sql
          test -s db/migrations/0006_factsport_homepage_sports_read_models.sql
          test -s db/migrations/0007_factsport_competition_player_stats.sql
          test -s db/migrations/0008_factsport_match_identity_alias.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.editorial_articles" db/migrations/0004_factsport_editorial_media.sql
          grep -q "CREATE OR REPLACE VIEW public.public_editorial_articles" db/migrations/0004_factsport_editorial_media.sql
          grep -q "review_status = 'approved'" db/migrations/0005_factsport_editorial_provenance_review.sql
          grep -q "rights_reviewed_at IS NOT NULL" db/migrations/0005_factsport_editorial_provenance_review.sql
          grep -q "CREATE OR REPLACE VIEW public.public_match_highlights" db/migrations/0006_factsport_homepage_sports_read_models.sql
          grep -q "CREATE OR REPLACE VIEW public.public_competition_standings" db/migrations/0006_factsport_homepage_sports_read_models.sql
          grep -q "CREATE OR REPLACE VIEW public.public_competition_player_stats" db/migrations/0007_factsport_competition_player_stats.sql
          grep -q "ADD COLUMN IF NOT EXISTS legacy_match_id uuid" db/migrations/0008_factsport_match_identity_alias.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.predictions" db/migrations/0003_factsport_public_predictions.sql
          for migration_number in $(seq 9 42); do
            migration_prefix="$(printf '%04d' "$migration_number")"
            migration_matches=(db/migrations/"$migration_prefix"_*.sql)
            if [ "${#migration_matches[@]}" -ne 1 ] || [ ! -s "${migration_matches[0]}" ]; then
              echo "::error::Expected exactly one non-empty migration for $migration_prefix"
              exit 1
            fi
          done
          grep -q "announcement_text" db/migrations/0024_factsport_media_public_announcements.sql
          grep -q "factsport_v2_editorial_writer" db/migrations/0025_factsport_media_homepage_settings_grants.sql
          grep -q "MEDIA_ATTESTATION_RECONCILIATION_REQUIRED" db/migrations/0026_factsport_public_media_attestation_enforcement.sql
          grep -q "EDITORIAL_ATTESTATION_RECONCILIATION_REQUIRED" db/migrations/0026_factsport_public_media_attestation_enforcement.sql
          grep -q "public_editorial_article_inline_media" db/migrations/0027_factsport_revision_inline_media_gallery.sql
          grep -q "media_broadcast_audit_events" db/migrations/0028_factsport_broadcast_admin_audit_and_role_history.sql
          grep -q "media_broadcast_token_rate_limits" db/migrations/0029_factsport_broadcast_token_rate_limits.sql
          grep -q "media_broadcast_webhook_events" db/migrations/0030_factsport_broadcast_token_identity_and_webhooks.sql
          grep -q "supports_media boolean NOT NULL DEFAULT false" db/migrations/0031_factsport_social_channel_media_capability.sql
          grep -q "public_social_media_assets" db/migrations/0032_factsport_social_dispatcher_media_and_receipts.sql
          grep -q "unknown_result" db/migrations/0032_factsport_social_dispatcher_media_and_receipts.sql
          grep -q "public_editorial_article_sources" db/migrations/0033_factsport_public_editorial_sources.sql
          grep -q "social_channel_configured" db/migrations/0034_factsport_editorial_audit_and_social_channel_admin.sql
          grep -q "latest.workflow_status='published'" db/migrations/0035_factsport_revision_scoped_editorial_sources.sql
          grep -q "provider_started_at timestamptz" db/migrations/0036_factsport_social_provider_dispatch_lock.sql
          grep -q "provider IN ('meta','telegram','buffer','make')" db/migrations/0037_factsport_social_provider_allowlist.sql
          grep -q "REVOKE UPDATE ON public.media_assets" db/migrations/0038_factsport_media_asset_column_grants.sql
          grep -q "media_asset_derivatives" db/migrations/0039_factsport_media_derivative_lineage.sql
          grep -q "media_rights_revoked" db/migrations/0040_factsport_media_rights_revocation.sql
          grep -q "public_editorial_article_video_tokens" db/migrations/0041_factsport_media_video_assets.sql
          grep -q "media_social_operator_reconciliation" db/migrations/0042_factsport_social_operator_reconciliation.sql
          echo "Migrations 0001-0042 present; immutable image derivatives, rights withdrawal, signed VOD assets, social unknown-result reconciliation, Media gallery, broadcast and least-privilege grants inventoried; live migration NOT executed"
