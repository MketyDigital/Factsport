name: Factsport v2 isolated verification

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - 'app/api/matches/**'
      - 'app/api/media/**'
      - 'app/api/settings/**'
      - 'app/api/standings/**'
      - 'app/api/competitions/**'
      - 'app/standings/**'
      - 'app/highlights/**'
      - 'app/components/**'
      - 'app/news/**'
      - 'app/page.tsx'
      - 'lib/adapters/postgres-editorial.ts'
      - 'lib/adapters/postgres-homepage.ts'
      - 'lib/adapters/postgres-client.ts'
      - 'lib/seo/**'
      - 'lib/adapters/postgres-matches.ts'
      - 'lib/adapters/factsport-cloudflare-bindings.ts'
      - 'types/factsport-cloudflare-workers.d.ts'
      - 'workers/factsport-schema-bootstrap.ts'
      - 'workers/generated-factsport-migration.ts'
      - 'scripts/generate-factsport-bootstrap.cjs'
      - 'db/migrations/**'
      - 'scripts/check-postgres.cjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/v2-verify.yml'

permissions:
  contents: read

jobs:
  verification:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run existing engine regression suite
        run: npm run test:engine
      - name: TypeScript static check
        run: npm run typecheck
      - name: Anonymous prediction and consent schema contract tests
        run: node --test tests/prediction-schema.test.cjs
      - name: PostgreSQL migration syntax inventory
        run: |
          test -s db/migrations/0001_factsport_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.matches" db/migrations/0001_factsport_core.sql
          test -s db/migrations/0003_factsport_public_predictions.sql
          test -s db/migrations/0004_factsport_editorial_media.sql
          test -s db/migrations/0005_factsport_editorial_provenance_review.sql
          test -s db/migrations/0006_factsport_homepage_sports_read_models.sql
          test -s db/migrations/0007_factsport_competition_player_stats.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.editorial_articles" db/migrations/0004_factsport_editorial_media.sql
          grep -q "CREATE OR REPLACE VIEW public.public_editorial_articles" db/migrations/0004_factsport_editorial_media.sql
          grep -q "review_status = 'approved'" db/migrations/0005_factsport_editorial_provenance_review.sql
          grep -q "rights_reviewed_at IS NOT NULL" db/migrations/0005_factsport_editorial_provenance_review.sql
          grep -q "CREATE OR REPLACE VIEW public.public_match_highlights" db/migrations/0006_factsport_homepage_sports_read_models.sql
          grep -q "CREATE OR REPLACE VIEW public.public_competition_standings" db/migrations/0006_factsport_homepage_sports_read_models.sql
          grep -q "CREATE OR REPLACE VIEW public.public_competition_player_stats" db/migrations/0007_factsport_competition_player_stats.sql
          grep -q "CREATE TABLE IF NOT EXISTS public.predictions" db/migrations/0003_factsport_public_predictions.sql
          echo "Foundation and public-prediction migrations present; live migration NOT executed"
