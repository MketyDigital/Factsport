name: Factsport v2 Cloudflare staging (Hyperdrive + R2)

# NEVER runs on main. Owner explicitly approved isolated staging provisioning.
# Only scoped v2 source changes trigger it; it does not deploy Factsport production.
# Workflow_dispatch on branch-only workflows is not reliable unless on default branch.
on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-cloudflare-staging.yml'
      - 'workers/hyperdrive-smoke.ts'
      - 'wrangler.hyperdrive-smoke.jsonc'
      - 'infra/cloudflare/**'
      - 'docs/implementation/CF-001-github-staging-r2.md'

permissions:
  contents: read

concurrency:
  group: factsport-v2-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KEY }}
      R2_BUCKET: factsport-v2-media-staging
    steps:
      - name: Validate required secrets without displaying values
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required existing GitHub secret is missing or empty: $key (mapped from CLOUDFLARE_ID / CLOUDFLARE_KEY)"
              exit 1
            fi
          done
      - name: Verify user or account Cloudflare token (no secrets logged)
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare supports distinct user-token and account-token verification URLs.
          # Only emit sanitized HTTP status and Cloudflare numeric error codes.
          verified=false
          for kind in user account; do
            if [ "$kind" = "user" ]; then
              URL="https://api.cloudflare.com/client/v4/user/tokens/verify"
            else
              URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
            fi
            FILE="$(mktemp)"
            STATUS="$(curl --silent --show-error --max-time 20 -o "$FILE" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$URL")"
            if [ "$STATUS" = "200" ] && jq -e '.success == true and .result.status == "active"' "$FILE" >/dev/null 2>&1; then
              echo "Cloudflare $kind API token verified active."
              verified=true
              rm -f "$FILE"
              break
            fi
            CODES="$(jq -r 'if (.errors | type) == "array" then [.errors[].code | select(type == "number")] | join(",") else "" end' "$FILE" 2>/dev/null || true)"
            echo "Cloudflare $kind token verification: HTTP $STATUS; error codes: ${CODES:-none}"
            rm -f "$FILE"
          done
          if [ "$verified" != "true" ]; then
            echo "::error::Neither Cloudflare user-token nor account-token verification passed. Check token active status, type, account association and Cloudflare numeric error codes above."
            exit 1
          fi
      - name: Check out only v2 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Guard and configure Factsport-only Hyperdrive settings
        shell: bash
        run: bash infra/cloudflare/configure-factsport-hyperdrive.sh
      - name: Ensure private R2 staging bucket exists
        shell: bash
        run: bash infra/cloudflare/ensure-r2-staging.sh
      - name: Deploy isolated staging smoke Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.hyperdrive-smoke.jsonc
      - name: Generate ephemeral FACTSPORT probe token and install Worker secret
        shell: bash
        run: |
          set -euo pipefail
          FACTSPORT_SMOKE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$FACTSPORT_SMOKE_TOKEN"
          printf 'FACTSPORT_SMOKE_TOKEN=%s\n' "$FACTSPORT_SMOKE_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$FACTSPORT_SMOKE_TOKEN" | npx --yes wrangler@4 secret put FACTSPORT_SMOKE_TOKEN --config wrangler.hyperdrive-smoke.jsonc
      - name: Probe Hyperdrive and R2 privately
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::No Worker deployment URL returned; check the deployment step"
            exit 1
          fi
          BASE="${DEPLOYMENT_URL%/}"
          for path in db-smoke r2-smoke; do
            RESPONSE="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 \
              -H "Authorization: Bearer $FACTSPORT_SMOKE_TOKEN" \
              "$BASE/__internal/$path")"
            echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
            if [ "$path" = 'r2-smoke' ]; then
              echo "$RESPONSE" | jq -e '.bound == true' >/dev/null
            fi
            echo "$path: OK"
          done
          echo "## Factsport v2 staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only Hyperdrive connection and private R2 binding checks succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only checks only. The already-applied Factsport schema stays in Azure. No SQL migrations, social posts, production deploys or R2 object writes occurred." >> "$GITHUB_STEP_SUMMARY"
