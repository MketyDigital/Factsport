name: Factsport v2 vinext compatibility (build only)

# Branch-only, non-deploying compatibility study of legacy Next.js 14.
# Never points a route/domain to production Factsport.
on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-vinext-compat.yml'
      - 'package.json'
      - 'app/**'
      - 'lib/**'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'vite.config.*'

permissions:
  contents: read

jobs:
  check-vinext:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current Factsport dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install vinext and Vite locally in disposable checkout
        run: npm install --no-save --ignore-scripts --no-audit --no-fund vinext@latest vite@latest
      - name: Initialize vinext Cloudflare staging in disposable checkout
        id: init
        shell: bash
        run: |
          set -o pipefail
          npx --no-install vinext init --platform=cloudflare --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --ignore-wrangler-config --name factsport-v2-staging
      - name: Inspect initialization diff (no credentials)
        if: always()
        run: |
          echo "## Factsport vinext compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Only a disposable GitHub runner checkout was modified. No Cloudflare app was deployed." >> "$GITHUB_STEP_SUMMARY"
          git status --short >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Test vinext build without deployment
        if: steps.init.outcome == 'success'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_for_build_only
          DATABASE_URL: ""
        shell: bash
        run: npx --no-install vite build
