name: Factsport v2 native vinext build (no deployment)

# Validates the actual committed Cloudflare configuration, not generated temp files.
# Do not deploy or attach routes to factsport.com.
on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-vinext-compat.yml'
      - 'package.json'
      - 'cloudflare.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'app/**'
      - 'lib/**'
      - 'types/**'
      - 'next.config.*'
      - 'postcss.config.*'

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. They are not deployed to users.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_for_build_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install committed dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Existing engine regression tests
        run: npm run test:engine
      - name: Isolated ingestion regression tests
        run: node --test tests/factsport-schedule.test.mjs tests/factsport-espn-reconciliation.test.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Cloudflare vinext build
        run: npm run build:vinext
      - name: Summarize
        if: success()
        run: |
          echo "## Factsport v2 vinext" >> "$GITHUB_STEP_SUMMARY"
          echo "Native Cloudflare build passed using committed cloudflare.config.ts and vite.config.ts." >> "$GITHUB_STEP_SUMMARY"
          echo "Build only: no Workers deployed, no production route changes." >> "$GITHUB_STEP_SUMMARY"
