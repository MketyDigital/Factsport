name: Morning Social Post
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  post-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Morning Post Route
        # 🟢 UPDATED: Points to your production domain so it fires reliably
        run: |
          curl -X GET "https://factsport.com/api/cron/morning-post?key=${{ secrets.CRON_KEY }}"