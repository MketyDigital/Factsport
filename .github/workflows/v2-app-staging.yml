name: Factsport v2 full application staging (protected)

# No production domain, DNS, or main-branch changes. Separate Worker only.
on:
  push:
    branches:
      - refactor/factsport-v2
    paths:
      - '.github/workflows/v2-app-staging.yml'
      - 'cloudflare.config.ts'
      - 'vite.config.ts'
      - 'middleware.ts'
      - 'package.json'
      - 'postcss.config.*'
      - 'app/**'
      - 'lib/**'
      - 'types/**'
      - 'next.config.*'

permissions:
  contents: read

concurrency:
  group: factsport-v2-app-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/refactor/factsport-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: factsport_staging_nonproduction_placeholder
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] ||
            { echo "::error::Existing CLOUDFLARE_ID or CLOUDFLARE_KEY repository secret unavailable"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refactor/factsport-v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Factsport regression suite
        run: npm run test:engine
      - name: Check Typescript
        run: npm run typecheck
      - name: Build native Factsport Cloudflare Worker
        run: npm run build:vinext
      - name: Deploy Factsport staging Worker with temporary access secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          FACTSPORT_STAGING_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$FACTSPORT_STAGING_TOKEN"
          printf 'FACTSPORT_STAGING_TOKEN=%s\n' "$FACTSPORT_STAGING_TOKEN" >> "$GITHUB_ENV"
          printf '{"FACTSPORT_STAGING_TOKEN":"%s"}\n' "$FACTSPORT_STAGING_TOKEN" > /tmp/factsport-staging-secrets.json
          npx --no-install cf deploy --prebuilt --secrets-file /tmp/factsport-staging-secrets.json
          rm -f /tmp/factsport-staging-secrets.json
      - name: Resolve Factsport staging Worker subdomain and test deny-by-default
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN_STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/factsport-worker-subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          if [ "$SUBDOMAIN_STATUS" != "200" ]; then
            echo "::error::Unable to locate account Workers subdomain (HTTP $SUBDOMAIN_STATUS)"
            exit 1
          fi
          SUBDOMAIN="$(jq -r '.result.subdomain // empty' /tmp/factsport-worker-subdomain.json)"
          [ -n "$SUBDOMAIN" ] || { echo "::error::Workers subdomain not present"; exit 1; }
          BASE="https://factsport-v2-staging.$SUBDOMAIN.workers.dev"
          for path in / /api/matches /admin /matches; do
            STATUS="$(curl --silent --show-error --max-time 25 --retry 6 --retry-all-errors --retry-delay 3 \
              -o /tmp/factsport-staging-unauthenticated -w '%{http_code}' "$BASE$path")"
            [ "$STATUS" = "404" ] || {
              echo "::error::Unsafe staging access: unauthenticated $path returned HTTP $STATUS instead of 404"
              exit 1
            }
            echo "Factsport staging $path: unauthorized access blocked"
          done
          HEALTH_STATUS="$(curl --silent --show-error --max-time 30 --retry-all-errors --retry 6 --retry-delay 3 \
            -o /tmp/factsport-staging-authorized-health -w '%{http_code}' \
            -H "x-factsport-staging-token: $FACTSPORT_STAGING_TOKEN" \
            "$BASE/api/v2/health")"
          if [ "$HEALTH_STATUS" != "200" ] || ! jq -e '.ok == true and .databaseReady == true and .mediaBucketReady == true' /tmp/factsport-staging-authorized-health >/dev/null 2>&1; then
            CODE="$(jq -r '.error // "non-json"' /tmp/factsport-staging-authorized-health 2>/dev/null || echo non-json)"
            echo "::error::Authorized staging health check failed: HTTP $HEALTH_STATUS; code $CODE"
            exit 1
          fi
          echo "Factsport native vinext app: authorized Hyperdrive and R2 dependency check passed"

          MATCH_PAGE_STATUS="$(curl --silent --show-error --max-time 30 \
            -o /tmp/factsport-staging-match-page.html -w '%{http_code}' \
            -H "x-factsport-staging-token: $FACTSPORT_STAGING_TOKEN" "$BASE/matches")"
          [ "$MATCH_PAGE_STATUS" = "200" ] && grep -q "Match Center" /tmp/factsport-staging-match-page.html || {
            echo "::error::Protected /matches page did not render from the v2 PostgreSQL reader (HTTP $MATCH_PAGE_STATUS)."
            exit 1
          }
          echo "Factsport staging /matches page: PostgreSQL-backed initial render passed"
          matches_ok=false
          for attempt in 1 2 3 4 5 6 7 8; do
            MATCH_STATUS="$(curl --silent --show-error --max-time 25 \
              -D /tmp/factsport-staging-matches.headers \
              -o /tmp/factsport-staging-matches -w '%{http_code}' \
              -H "x-factsport-staging-token: $FACTSPORT_STAGING_TOKEN" \
              "$BASE/api/matches?league=Premier%20League&type=fixtures&cursor=2026-11-01")"
            if [ "$MATCH_STATUS" = "200" ] && jq -e 'type == "array" and length > 0' /tmp/factsport-staging-matches >/dev/null 2>&1; then
              matches_ok=true
              break
            fi
            CODE="$(jq -r '.error // "non-json"' /tmp/factsport-staging-matches 2>/dev/null || echo non-json)"
            DETAILS="$(jq -r 'if type == "object" then "sqlState=" + (.sqlState // "none") + " class=" + (.errorClass // "none") else "" end' /tmp/factsport-staging-matches 2>/dev/null || true)"
            GATE="$(grep -qFx 'Not found' /tmp/factsport-staging-matches && echo gate-or-404 || echo other)"
            echo "Factsport match probe attempt $attempt: HTTP $MATCH_STATUS; code $CODE; bodyClass=$GATE $DETAILS"
            sleep 3
          done
          [ "$matches_ok" = true ] || {
            echo "::error::Authorized Factsport matches API did not return a JSON array. See sanitized diagnostics."
            exit 1
          }
          if ! grep -Eiq '^cache-control:[[:space:]]*.*(private|no-store)' /tmp/factsport-staging-matches.headers; then
            echo "::error::Token-protected staging match response must not be publicly cacheable."
            exit 1
          fi
          UNAUTH_MATCH_STATUS="$(curl --silent --show-error --max-time 25 \
            -o /tmp/factsport-staging-after-auth-unauthorized -w '%{http_code}' \
            "$BASE/api/matches?league=Premier%20League&type=fixtures&cursor=2026-11-01")"
          [ "$UNAUTH_MATCH_STATUS" = "404" ] || {
            echo "::error::Unauthenticated match request after authorized request returned HTTP $UNAUTH_MATCH_STATUS; possible cache isolation failure."
            exit 1
          }
          AUTH_MATCH_STATUS=000
          auth_match_ok=false
          for attempt in 1 2 3 4 5 6; do
            AUTH_MATCH_STATUS="$(curl --silent --show-error --max-time 25 \
              -o /tmp/factsport-staging-after-unauth-authorized -w '%{http_code}' \
              -H "x-factsport-staging-token: $FACTSPORT_STAGING_TOKEN" \
              "$BASE/api/matches?league=Premier%20League&type=fixtures&cursor=2026-11-01")"
            if [ "$AUTH_MATCH_STATUS" = "200" ] && jq -e 'type == "array" and length > 0' /tmp/factsport-staging-after-unauth-authorized >/dev/null 2>&1; then
              auth_match_ok=true
              break
            fi
            FINAL_CODE="$(jq -r '.error // "non-json"' /tmp/factsport-staging-after-unauth-authorized 2>/dev/null || echo non-json)"
            FINAL_DETAILS="$(jq -r 'if type == "object" then "sqlState=" + (.sqlState // "none") + " class=" + (.errorClass // "none") else "" end' /tmp/factsport-staging-after-unauth-authorized 2>/dev/null || true)"
            echo "Authorized post-cache probe attempt $attempt: HTTP $AUTH_MATCH_STATUS; code $FINAL_CODE; $FINAL_DETAILS"
            sleep 2
          done
          [ "$auth_match_ok" = true ] || {
            echo "::error::Authorized match request failed after cache isolation check (HTTP $AUTH_MATCH_STATUS)."
            exit 1
          }
          echo "Factsport native vinext app: protected PostgreSQL matches API returned populated fixtures; staging response is private/no-store and auth isolation passed."

          echo "## Factsport v2 application staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed separate protected Worker: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Unauthenticated /, /api/matches and /admin blocked; authorized /api/v2/health and /api/matches passed native Hyperdrive + R2 integration." >> "$GITHUB_STEP_SUMMARY"
          echo "No production routes or domains changed. No production Supabase service role deployed." >> "$GITHUB_STEP_SUMMARY"
